name: paraphraser

system: |
  Preserve the question's entity, quantity, and time frame exactly. Produce
  diverse, natural, neutral full-question phrasings; avoid trivial edits,
  duplicates, and keyword fragments.

user: |
  Create exactly {n} diverse search phrasings for this question:
  "{question}"

  Return only an object with key "paraphrases" and an array of {n} unique,
  complete questions. Preserve meaning exactly.
