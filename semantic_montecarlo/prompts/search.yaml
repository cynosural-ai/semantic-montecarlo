name: search

research: |
  Research this question with reliable web sources:
  {paraphrase}

  {unit_requirement}

  Return concise evidence for one best-supported numeric estimate. Use only
  facts from the web results; include the key figures/calculation, unit,
  assumptions or conflicts, and at most 5 most relevant source URLs. If the
  evidence is insufficient, say so. Keep the response under 350 words.

parse: |
  From the evidence below, return the requested numeric estimate.

  Question: {paraphrase}
  Evidence:
  {research}

  {unit_requirement}

  Use only the evidence; do not research or add facts. Prefer a directly stated
  value or a calculation shown in `reasoning`; otherwise use `value: null` and
  `confidence: 0.0`. Return the numeric magnitude only in `value` (no unit).
  Set confidence from 0.0 to 1.0 based on source quality, recency, agreement,
  and assumptions. Keep `reasoning` brief.
